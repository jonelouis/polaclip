<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola Clip - Transform Your Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .hero-section {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .hero-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .hero-section h1 .highlight {
            color: #ff6b35;
        }
        
        .hero-section p {
            font-size: 18px;
            color: #666;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }
        
        .comparison-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 60px 0;
        }
        
        .comparison-image {
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 50px;
        }
        
        .btn {
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        
        .btn-primary {
            background: #ff6b35;
            color: white;
        }
        
        .btn-primary:hover {
            background: #e55a24;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #ff6b35;
            border: 2px solid #ff6b35;
        }
        
        .btn-secondary:hover {
            background: #fff5f0;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 32px;
            }
            
            .hero-section p {
                font-size: 16px;
            }
            
            .comparison-container {
                gap: 20px;
            }
            
            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <h1>Transform Your <span class="highlight">Long Videos</span> Into Viral Shorts</h1>
            <p>See how we convert your 22-minute YouTube videos into engaging short-form clips optimized for Reels, Shorts, and TikTok.</p>
        </div>
        
        <div class="comparison-container">
            <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663622535610/A7dywVcbQmTCubrMb2ACVo/hero-before-after-comparison-SDDPVscG3QJuWeuuxKgqxQ.webp" alt="Before and After Video Transformation" class="comparison-image">
        </div>
        
        <div class="cta-buttons">
            <button class="btn btn-primary" onclick="window.location.href='/#pricing'">See Pricing</button>
            <button class="btn btn-secondary" onclick="window.location.href='/#pricing'">Request Free Sample</button>
        </div>
    </div>
</body>
</html>
